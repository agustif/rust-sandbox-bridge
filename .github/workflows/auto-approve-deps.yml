name: Auto-approve dependency requests

# Approves pending cargo dependency issues every 5 minutes by applying
# the `approved-deps` label. Skips the whole cycle if a vendor build is
# already queued or in progress (avoids pile-ups).
#
# Security note: this intentionally weakens the human-approval gate for
# this repo. Disable or delete this workflow to restore manual-only approval.

on:
  schedule:
    # GitHub may delay cron on free/public repos; 5m is the requested cadence.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: auto-approve-deps
  cancel-in-progress: false

jobs:
  auto-approve:
    name: Label pending dep requests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip if vendor workflow already working
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Find the vendor workflow id
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner,
              repo,
              per_page: 100,
            });
            const vendor = workflows.workflows.find(
              (w) => w.path === '.github/workflows/build-vendor-bundle.yml'
            );
            if (!vendor) {
              core.warning('Vendor workflow not found; proceeding carefully');
              core.setOutput('skip', 'false');
              return;
            }

            const statuses = ['queued', 'in_progress', 'waiting', 'requested', 'pending'];
            let busy = 0;
            for (const status of statuses) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: vendor.id,
                status,
                per_page: 5,
              });
              busy += data.total_count;
            }

            if (busy > 0) {
              core.info(`Vendor workflow already working (${busy} run(s) active) — skip cycle`);
              core.setOutput('skip', 'true');
              core.setOutput('busy', String(busy));
              return;
            }

            core.info('No active vendor runs — will approve pending requests');
            core.setOutput('skip', 'false');
            core.setOutput('busy', '0');

      - name: Approve pending dependency requests
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const APPROVAL = 'approved-deps';
            const BUILT = 'deps-built';

            // Open issues that look like dep requests and are not yet approved/built.
            const q = `repo:${owner}/${repo} is:issue is:open -label:${APPROVAL} -label:${BUILT}`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q,
              per_page: 50,
              sort: 'created',
              order: 'asc',
            });

            const candidates = (search.items || []).filter((issue) => {
              if (issue.pull_request) return false;
              const title = (issue.title || '').toLowerCase();
              const body = issue.body || '';
              const looksLikeDeps =
                title.startsWith('deps:') ||
                title.includes('dependency') ||
                body.includes('"schema"') ||
                body.includes('```json');
              return looksLikeDeps;
            });

            if (candidates.length === 0) {
              core.info('No pending dependency requests to approve');
              await core.summary
                .addHeading('Auto-approve')
                .addRaw('No pending dependency requests.')
                .write();
              return;
            }

            const approved = [];
            for (const issue of candidates) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [APPROVAL],
                });
                core.info(`Approved #${issue.number}: ${issue.title}`);
                approved.push(`#${issue.number} ${issue.title}`);

                // Optional comment for audit trail (once)
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    '✅ **Auto-approved** by `auto-approve-deps` (5‑minute hook).',
                    '',
                    'This applies the `approved-deps` label so the vendor workflow can run.',
                    'To restore manual-only approval, disable `.github/workflows/auto-approve-deps.yml`.',
                  ].join('\n'),
                });
              } catch (e) {
                core.warning(`Failed to approve #${issue.number}: ${e.message || e}`);
              }
            }

            await core.summary
              .addHeading('Auto-approve')
              .addList(approved.length ? approved : ['(none)'])
              .write();

      - name: Summary when skipped
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "Skipped: vendor workflow already working (busy=${{ steps.gate.outputs.busy }})" >> "$GITHUB_STEP_SUMMARY"
